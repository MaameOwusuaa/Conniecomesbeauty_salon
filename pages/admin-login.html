<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | Conniecomes Beauty Salon</title>
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/admin.css">
</head>
<body>
  <div class="announcement">Conniecomes administration</div>
  <header class="site-header">
    <a class="logo" href="../index.html">CONNIECOMES<span>BEAUTY SALON</span></a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
    <nav class="nav">
      <a href="admin.html">Admin dashboard</a>
    </nav>
  </header>
  <main class="page">
    <div class="page-header">
      <p class="eyebrow">Restricted access</p>
      <h1>Admin sign in</h1>
      <p>Use the authorized administrator account.</p>
    </div>
    <form id="adminLoginForm" class="form">
      <div class="field">
        <label for="adminEmail">Admin email</label>
        <input id="adminEmail" name="email" type="email" value="otrish95@gmail.com" readonly required autocomplete="username">
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit">Sign in to admin</button>
      <p id="adminLoginMessage" class="notice hidden" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="../src/js/admin-login.js"></script>
</body>
</html>
